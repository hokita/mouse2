<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070a1a" />
    <title>mouse2</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <!-- iOS ignores the manifest icons; this is the home-screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-title" content="mouse2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        color-scheme: dark;
        /* The canvas is letterboxed on anything that is not a tall phone;
           this is what fills the bars, so the surround reads as part of the
           game rather than as dead space. */
        background:
          radial-gradient(120% 80% at 50% 0%, #1b1f4b 0%, rgba(27, 31, 75, 0) 60%),
          #05070f;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app canvas {
        /* Softens the seam between the letterbox and the play area. */
        box-shadow: 0 0 60px rgba(69, 224, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
